<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Crochet Catalog</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-low": "#f5f5dc",
                    "inverse-primary": "#eebba6",
                    "primary-fixed": "#ffdbcc",
                    "secondary-container": "#b6ebd8",
                    "inverse-on-surface": "#f2f2d9",
                    "surface": "#fbfbe2",
                    "on-secondary-container": "#3a6c5d",
                    "on-primary": "#ffffff",
                    "on-error-container": "#93000a",
                    "error": "#ba1a1a",
                    "primary-fixed-dim": "#eebba6",
                    "on-tertiary": "#ffffff",
                    "primary-container": "#ffcbb5",
                    "on-error": "#ffffff",
                    "outline": "#83746e",
                    "surface-bright": "#fbfbe2",
                    "secondary-fixed": "#b9eedb",
                    "on-secondary-fixed": "#002018",
                    "background": "#fbfbe2",
                    "on-tertiary-fixed-variant": "#4f4257",
                    "surface-container-high": "#eaead1",
                    "on-primary-fixed-variant": "#613e2e",
                    "tertiary-fixed-dim": "#d3c0db",
                    "on-background": "#1b1d0e",
                    "surface-container": "#efefd7",
                    "surface-container-lowest": "#ffffff",
                    "outline-variant": "#d5c3bc",
                    "inverse-surface": "#303221",
                    "surface-tint": "#7c5544",
                    "on-surface": "#1b1d0e",
                    "tertiary-fixed": "#efdcf7",
                    "on-secondary": "#ffffff",
                    "surface-variant": "#e4e4cc",
                    "surface-container-highest": "#e4e4cc",
                    "on-tertiary-container": "#66586e",
                    "on-primary-fixed": "#2f1407",
                    "on-secondary-fixed-variant": "#1c4f41",
                    "error-container": "#ffdad6",
                    "secondary": "#366758",
                    "on-tertiary-fixed": "#22172a",
                    "on-surface-variant": "#51443f",
                    "tertiary": "#685970",
                    "surface-dim": "#dbdcc3",
                    "secondary-fixed-dim": "#9dd1bf",
                    "tertiary-container": "#e3d0eb",
                    "primary": "#7c5544",
                    "on-primary-container": "#7a5442"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px",
                    "2xl": "1.5rem"
            },
            "spacing": {
                    "unit": "4px",
                    "stack-sm": "8px",
                    "section-gap": "48px",
                    "stack-lg": "32px",
                    "gutter": "16px",
                    "stack-md": "16px",
                    "container-margin": "24px"
            },
            "fontFamily": {
                    "body-md": ["Inter", "sans-serif"],
                    "display": ["Montserrat", "sans-serif"],
                    "label-sm": ["Inter", "sans-serif"],
                    "body-lg": ["Inter", "sans-serif"],
                    "headline-lg": ["Montserrat", "sans-serif"],
                    "label-lg": ["Inter", "sans-serif"],
                    "headline-md": ["Montserrat", "sans-serif"]
            }
          }
        }
      }
    </script>
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: #F5F5DC; 
        }
        .soft-shadow {
            box-shadow: 0 10px 30px rgba(124, 85, 68, 0.08);
        }
        .squish-click:active {
            transform: scale(0.98);
        }
        #btn-whatsapp {
            position: fixed;
            bottom: 90px; 
            right: 30px;
            background-color: #25D366;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            z-index: 1000;
        }
        #btn-whatsapp:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="font-body-md text-on-surface antialiased pb-24 md:pb-0">
    <header class="fixed top-0 w-full z-50 bg-surface/70 backdrop-blur-md shadow-sm">
        <div class="flex justify-between items-center px-container-margin py-4 w-full max-w-7xl mx-auto">
            <div class="flex items-center gap-6">
                <button class="md:hidden text-on-surface-variant hover:opacity-80 transition-opacity">
                    <span class="material-symbols-outlined" data-icon="menu">menu</span>
                </button>
                <a class="font-display text-headline-lg font-bold text-primary" href="#">Crochet Catalog</a>
            </div>
            <nav class="hidden md:flex gap-8 items-center font-label-lg text-label-lg">
                <a class="text-primary border-b-2 border-primary pb-1 squish-click" href="#">Home</a>
                <a class="text-on-surface-variant hover:opacity-80 transition-opacity squish-click" href="#catalogo">Browse</a>
                <a class="text-on-surface-variant hover:opacity-80 transition-opacity squish-click" href="custom-orders.html">Custom Orders</a>
                <a class="text-on-surface-variant hover:opacity-80 transition-opacity squish-click" href="about.html">About</a>
            </nav>
            <div class="flex items-center gap-4">
                <button class="text-on-surface-variant hover:opacity-80 transition-opacity squish-click">
                    <span class="material-symbols-outlined" data-icon="search">search</span>
                </button>
                <a class="text-on-surface-variant hover:opacity-80 transition-opacity squish-click flex items-center" href="cart.html">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">shopping_bag</span>
                    <span id="contador-carrito" class="ml-1 bg-primary text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="pt-24 max-w-7xl mx-auto px-container-margin">
        <section class="mt-stack-lg mb-section-gap">
            <div class="relative bg-surface-container-lowest rounded-2xl overflow-hidden soft-shadow group">
                <div class="w-full h-[400px] md:h-[500px] bg-cover bg-center bg-no-repeat" style="background-image: url('https://images.unsplash.com/photo-1628148810757-0a9f5dceafbc?q=80&w=2000&auto=format&fit=crop');"></div>
                <div class="absolute inset-0 bg-gradient-to-r from-[#fbfbe2]/95 via-[#fbfbe2]/70 to-transparent flex items-center">
                    <div class="max-w-xl pl-8 md:pl-16">
                        <h1 class="font-display text-[40px] leading-tight font-bold text-primary mb-stack-sm">Handcrafted Companions</h1>
                        <p class="font-body-lg text-lg text-on-surface-variant mb-stack-lg max-w-md">Bring home a touch of warmth with our artisanal amigurumi plushies, stitched with love and high-quality yarn.</p>
                        <button onclick="document.getElementById('catalogo').scrollIntoView()" class="bg-primary text-on-primary font-label-lg font-bold px-8 py-3.5 rounded-full soft-shadow hover:opacity-90 squish-click transition-all">Shop Now</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="catalogo" class="mb-section-gap scroll-mt-28">
            <div class="flex justify-between items-end mb-stack-md">
                <h2 class="font-headline-lg text-2xl font-bold text-on-surface">New Arrivals</h2>
            </div>
            
            <div id="contenedor-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-gutter">
                <p class="col-span-full text-center py-10 font-body-lg text-on-surface-variant">
                    <span class="material-symbols-outlined animate-spin text-primary text-3xl mb-2">sync</span>
                    <br>Cargando colección mágica...
                </p>
            </div>
        </section>
    </main>

    <button id="btn-whatsapp" onclick="window.location.href='cart.html'" class="flex items-center gap-2">🛒 Ver Carrito</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
