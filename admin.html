<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos específicos para el formulario del admin */
        .admin-container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>🛠️ Subir Nuevo Producto</h2>
        
        <form id="form-producto">
            <label>Nombre del Tejido:</label>
            <input type="text" id="nombre" required placeholder="Ej. Bufanda Roja">

            <label>Descripción:</label>
            <textarea id="descripcion" required placeholder="Detalles, medidas, estambre..."></textarea>

            <label>Precio (MXN):</label>
            <input type="number" id="precio" required placeholder="250">

            <label>URL de la Imagen:</label>
            <input type="url" id="imagen_url" required placeholder="https://ejemplo.com/foto.jpg">

            <button type="submit" class="btn-agregar" style="background-color: #2c3e50;">Guardar Producto</button>
        </form>
        
        <p id="mensaje-admin" style="text-align:center; margin-top:15px; font-weight:bold;"></p>

        <hr style="margin: 40px 0; border: 1px solid #eee;">
        
        <h2>📦 Inventario Actual</h2>
        <div id="lista-inventario" style="margin-top: 20px;">
            Cargando inventario...
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
