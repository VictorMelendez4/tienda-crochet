<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    
    
    <style>
        .shadow-ambient { box-shadow: 0 10px 30px -5px rgba(124, 85, 68, 0.08); }
        .squish-active:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-[#f5f5dc] text-[#1b1d0e] font-sans min-h-screen pt-20 pb-20">

    <main class="max-w-7xl mx-auto px-6">
        <div class="mb-8">
            <a href="index.html" class="inline-flex items-center gap-2 text-[#7c5544] hover:opacity-80 transition-opacity font-semibold mb-4 group">
            <span class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform">arrow_back</span>
            Seguir comprando
            </a>
    
            <h1 class="text-4xl font-bold text-[#1b1d0e]">Your Cart</h1>
            <p id="contador-items" class="text-gray-600 mt-2 text-sm">1 item en tu carrito.</p>
        </div>

        <div class="flex flex-col lg:flex-row gap-12">
            <div id="lista-carrito" class="flex-grow flex flex-col gap-4">
                </div>

            <div class="w-full lg:w-96 shrink-0">
                <div class="bg-white rounded-2xl p-8 shadow-lg sticky top-24">
                    <h2 class="text-2xl font-bold mb-6">Order Summary</h2>
                    <div class="space-y-4 border-b border-gray-200 pb-6 mb-6">
                        <div class="flex justify-between text-gray-600">
                            <span>Subtotal</span>
                            <span id="subtotal-precio">$0.00</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center mb-8">
                        <span class="text-xl font-bold">Total</span>
                        <span id="total-precio" class="text-3xl font-bold text-[#7c5544]">$0.00</span>
                    </div>
                    <button onclick="enviarPedidoWhatsApp()" class="w-full bg-[#7c5544] text-white py-4 rounded-full font-bold hover:bg-orange-900 transition-all">
                    Checkout →
                    </button>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="cart.js"></script>
</body>
</html>
