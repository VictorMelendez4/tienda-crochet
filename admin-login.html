<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yarnly - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F5F5DC] flex items-center justify-center min-h-screen font-sans">
    
    <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 w-full max-w-sm">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-[#1b1d0e]">Yarnly Admin</h2>
            <p class="text-gray-500 mt-2 text-sm">Ingresa tus credenciales para continuar</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-bold text-gray-700 mb-1">Correo Electrónico</label>
                <input id="email" type="email" required class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-[#7c5544] bg-gray-50">
            </div>
            <div>
                <label for="password" class="block text-sm font-bold text-gray-700 mb-1">Contraseña</label>
                <input id="password" type="password" required class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-[#7c5544] bg-gray-50">
            </div>
            
            <button type="submit" class="w-full bg-[#7c5544] text-white py-3 rounded-full font-bold hover:bg-orange-900 transition-all shadow-md mt-4">
                Entrar al Dashboard
            </button>
            
            <p id="mensaje-login" class="text-sm text-center font-semibold mt-4"></p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
</body>
</html>
