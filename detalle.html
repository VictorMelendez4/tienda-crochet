<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <style>
        /* Agregamos los estilos faltantes que no son de Tailwind */
        .soft-shadow { box-shadow: 0 8px 30px rgba(124, 85, 68, 0.08); }
        .squish { transition: transform 0.2s ease; }
        .squish:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-[#F5F5DC] text-[#1B1D0E] font-sans min-h-screen pt-10">

    <main class="max-w-[1200px] mx-auto px-6 py-12">
    <nav class="flex items-center gap-2 text-sm font-medium mb-8">
        <a href="index.html" class="inline-flex items-center gap-1.5 text-gray-500 hover:text-[#7c5544] transition-all duration-200 mb-8 font-medium">
            <span class="material-symbols-outlined text-lg">arrow_back</span>
            Volver al catálogo
        </a>
        <span id="nombre-producto-breadcrumb" class="hidden"></span>
    </nav>

        <section class="grid grid-cols-1 lg:grid-cols-2 gap-12">
        <div class="w-full aspect-square bg-[#EFEFD7] rounded-3xl shadow-ambient p-3 flex items-center justify-center border border-white/50">
            <img id="img-principal" src="" alt="Producto" class="w-full h-full object-cover rounded-2xl">
        </div>

            <div class="flex flex-col justify-center py-4">
                <h1 id="titulo-producto" class="text-5xl font-extrabold text-[#1b1d0e] mb-4 tracking-tight">Cargando...</h1>
            <div id="precio-producto" class="text-3xl font-bold text-[#7c5544] mb-8">$0.00</div>
    
            <div class="space-y-4 mb-10">
                <h3 class="font-bold text-lg text-gray-800">Descripción</h3>
                <p id="desc-producto" class="text-gray-600 leading-relaxed text-lg italic">
                    Cargando descripción...
                </p>
            </div>

                <button id="btn-add-cart" class="group w-full max-w-[300px] bg-[#7c5544] text-white py-5 rounded-full font-bold text-lg shadow-xl hover:bg-orange-900 hover:shadow-2xl transition-all duration-300 flex items-center justify-center gap-2">
                    <span>Add to Cart</span>
                    <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">shopping_bag</span>
                </button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="detalle.js"></script>
</body>
</html>
